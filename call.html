<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Calling Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #root {
            width: 100%;
            height: 80vh;
            margin: auto;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Video Calling Platform</h1>
    <div id="root"></div>

    <script src="https://resource.zegocloud.com/prebuilt/crypto-js.js"></script>
    <script src="https://resource.zegocloud.com/prebuilt/prebuiltToken.js"></script>
    <script src="https://zegocloud.github.io/zegocloud_prebuilt_webrtc/ZegoPrebuilt/index.umd.js"></script>
    <script>
        // Generate a unique token using your App ID and Server Secret
        const appId = 1152931286; // Replace with your actual App ID
        const serverSecret = "d4bdaa634bb85bcd67ffc891be252cd2"; // Replace with your actual Server Secret
        const roomId = "room2"; // Replace with your desired room ID
        const userId = "UserID-" + Math.floor(Math.random() * 10000);
        const userName = "jack" + Math.floor(Math.random() * 10000);

        const TOKEN = generatePrebuiltToken(appId, serverSecret, roomId, userId, userName);

        // Create and join the room using the Zego Prebuilt UI Kit
        const zp = ZegoUIKitPrebuilt.create(TOKEN);
        zp.joinRoom({
            container: document.querySelector("#root"), // The container to render the video call
            scenario: {
                mode: ZegoUIKitPrebuilt.VideoConference,
            },
        });
    </script>
</body>
</html>
